# SnapBeforeWatchTower configuration example.
# Copy this file to config.toml, edit it, then run:
#   sudo python3 SnapBeforeWatchTower.py -c config.toml
# CLI reference: python3 SnapBeforeWatchTower.py --help
# Version:       python3 SnapBeforeWatchTower.py --version
# Relative dataset/TLS file paths use the TOML directory. dataset_file also expands ~.
# The -c CONFIG path itself uses the current working directory when relative.

[application]
# Operation to perform: "create" creates a snapshot and then applies retention;
# "delete" only applies retention and does not create snapshots or capture Docker digests.
command = "create"

# UTF-8 text file containing one ZFS dataset name per non-empty line.
# Relative paths are resolved relative to this TOML file.
# Missing-dataset continuation is controlled by continue_on_missing_dataset below.
# A missing dataset always makes the final run a failure.
dataset_file = "datasets"

# Age cutoff for managed snapshots and log groups.
# Use a nonnegative integer followed by d (days), w (weeks), or m (30-day months).
# Examples: "7d", "2w", "1m", "0d".
older_than = "7d"

# Always protect this many newest matching snapshots per dataset and log timestamp groups.
# Zero or a negative integer disables the count floor; age rules still apply.
retain_count = 10

# When true, preview ZFS snapshot creation/destruction and old-log deletion.
# Dry-run still lists ZFS snapshots and writes run logs; Docker digest capture is skipped.
# Mail and MQTT use the same notification policy as real runs: failures are reported when
# the channel is enabled, while successful dry-runs require that channel's on_success=true.
dry_run = true

# true = when ZFS explicitly reports a configured dataset as nonexistent, record the
# failure and continue with the next configured dataset. false = stop immediately.
# Either way, the final result is failure and enabled mail/MQTT reports that failure.
continue_on_missing_dataset = true

# true = for any other checked ZFS list/destroy command failure on one dataset,
# record the failure and continue with the next configured dataset. false = stop
# immediately. This does not make global/config/root/input failures recoverable.
continue_on_other_failures = true

[mail]
# Optional mail notification feature. Set true to enable failure mail.
enabled = false

# Recipient passed to the local `mail` command when mail is enabled.
recipient = "you@example.com"

# When true, also send success mail for both real and dry-run executions.
# Failure mail is always sent when mail is enabled, regardless of this setting.
on_success = false

[mqtt]
# Optional final MQTT JSON status report. Set true to enable MQTT reporting.
enabled = false

# When true, also publish success reports for both real and dry-run executions.
# Failure reports are always published when MQTT is enabled, regardless of this setting.
on_success = false

# MQTT broker hostname or IP address.
host = "mqtt.example.local"

# MQTT broker TCP port, integer 1-65535. Use 1883 for normal MQTT or commonly 8883 for TLS.
# If omitted, the default is 8883 with tls=true or 1883 otherwise. An explicit port is kept.
port = 1883

# Publish topic: nonempty, no NUL, no wildcards (+/#), at most 65535 UTF-8 bytes.
# Replace example-host consistently here and in the Home Assistant MQTT trigger.
topic = "homeassistant/SnapBeforeWatchTower/example-host/status"

# MQTT-only title fallback (default: SnapBeforeWatchTower). A nonempty [report].title
# overrides this value and supplies the shared email/MQTT heading.
title = "Example host - SnapBeforeWatchTower"

# Optional MQTT username. Use an empty string for no username authentication.
username = "your-mqtt-user"

# Optional plain MQTT password string. It requires a non-empty username when MQTT is enabled.
# Protect the operational TOML file because this value is stored as plaintext.
password = "<String>"

# MQTT Quality of Service. Valid values are 0, 1, or 2. Reports are always non-retained.
qos = 0

# Enable verified TLS. Hostname and certificate verification are not disabled.
tls = false

# Optional CA bundle path for TLS. Use an empty string to use system trusted CAs.
# Relative paths are resolved relative to this TOML file.
ca_file = ""

# Optional client certificate path for mutual TLS. Must be used together with key_file.
# Relative paths are resolved relative to this TOML file.
cert_file = ""

# Optional client private-key path for mutual TLS. Must be used together with cert_file.
# Relative paths are resolved relative to this TOML file.
key_file = ""

# Total MQTT worker timeout in seconds. Valid integer range: 1 through 120.
timeout = 15
